version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resell_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resell_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: resell_keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    command:
      - start-dev
      - --http-port=8180
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resell_api
    environment:
      RESELL_DATABASE_HOST: postgres
      RESELL_DATABASE_PORT: 5432
      RESELL_DATABASE_USER: postgres
      RESELL_DATABASE_PASSWORD: postgres
      RESELL_DATABASE_DBNAME: resell
      RESELL_DATABASE_SSLMODE: disable
      RESELL_REDIS_HOST: redis
      RESELL_REDIS_PORT: 6379
      RESELL_KEYCLOAK_URL: http://keycloak:8180
      RESELL_KEYCLOAK_REALM: resell
      RESELL_KEYCLOAK_CLIENT_ID: resell-api
      RESELL_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
